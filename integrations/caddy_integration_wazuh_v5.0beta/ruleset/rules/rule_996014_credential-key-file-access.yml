id: '1f7a3e9c-4b2d-4c83-a6e1-9d5f2c8a4b30'
logsource:
  product: caddy
tags:
  - attack.credential-access
  - attack.t1552.001
falsepositives:
  - Rare, this pattern targets credential material specifically
level: critical
status: experimental
enabled: true
metadata:
  title: Caddy Credential or Private Key File Access
  author: Anmol Vats
  description: Detects access attempts to credential files, private keys, and secrets (id_rsa, credentials.json, .pem, etc.).
  references:
    - 'https://github.com/wazuh/wazuh/issues/37033'
  documentation: ''
  supports:
    - '5.0'
detection:
  selection:
    url.original|re: '(?i)(\/\.env(\.|$|\/)|\/id_rsa|\/id_dsa|\/id_ed25519|\/id_ecdsa|credentials?\.json|credentials?\.xml|secrets?\.json|secrets?\.ya?ml|jwt\.(pem|secret)|private\.key|oauth\.json|token\.json|authorized_keys|known_hosts|\.p12$|\.pfx$|\.pem$|\.key$)'
  condition: selection
