id: '6c2e9f4a-1d8b-4a75-8c3e-4b7a9f1d2e56'
logsource:
  product: caddy
tags:
  - attack.collection
  - attack.t1530
falsepositives:
  - Legitimate backup file serving in some deployments
level: high
status: experimental
enabled: true
metadata:
  title: Caddy Backup or Database Dump File Access
  author: Anmol Vats
  description: Detects access to backup, dump, or database files (.bak, .sql, .db, .tar.gz, etc.).
  references:
    - 'https://github.com/wazuh/wazuh/issues/37033'
  documentation: ''
  supports:
    - '5.0'
detection:
  selection:
    url.original|re: '(?i)\.(bak|backup|old|orig|save|swp|sql|dump|sqlite|db|mdb|tar\.gz|tar\.bz2|tgz|7z|rar)(\?|$)'
  condition: selection
